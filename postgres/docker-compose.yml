name: trello
services:
  db:
    image: postgres:16
    container_name: postgres_trello
    environment:
      POSTGRES_DB: trello_db
      POSTGRES_USER: laravel
      POSTGRES_PASSWORD: secret
    ports:
      - "45432:5432"
    volumes:
      - postgres_trello_data:/var/lib/postgresql/data
      - ./conf:/etc/postgresql
    restart: unless-stopped
    networks:
      - trello_net

volumes:
  postgres_trello_data:

networks:
  trello_net:
    external: true
